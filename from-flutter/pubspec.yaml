name: fluidlearn_app
description: "FluidLearn — referencia Dart del proyecto original (USB)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  google_sign_in: ^6.2.1
  flutter_tts: ^4.2.5
  speech_to_text: ^7.3.0
  record: ^6.2.0
  path_provider: ^2.1.5
  audioplayers: ^6.6.0
  permission_handler: ^12.0.1
  firebase_storage: ^13.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
